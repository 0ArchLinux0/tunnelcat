# GitHub Actions workflow for tunnelcat.
#
# Runs on every push and every pull request. Two jobs:
#   1. `go` — Go build, vet, test, and the cgo FFI smoke test.
#        Builds the Rust crate in this same job (so the cgo
#        static lib exists before go build runs).
#   2. `rust` — cargo test, fmt, clippy on the protocol crate.
#
# The cgo build is the most important thing: if the FFI
# boundary breaks, nothing else matters. The `go` job does
# that build, plus all the Go tests.
#
# Cache strategy: Go module cache and Cargo target cache both
# keyed on the lockfile hash. Cuts CI from ~6 min cold to ~2
# min warm.
#
# Last updated: 2026-09-01.

name: test

on:
  push:
    branches: [main, "sess-*"]
  pull_request:
    branches: [main]

# Cancel in-flight CI for the same branch on a new push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────
  # Job 1: Go. The bulk of the project.
  #
  # The cgo package (internal/rustbridge) links against a Rust
  # static library that we build below. We do it in this same
  # job (not in a separate `rust` job that the `go` job depends
  # on) because (a) it's the only Rust work, (b) it keeps the
  # workflow simple, (c) we don't need the Rust tests here.
  # ─────────────────────────────────────────────────────────────
  go:
    name: go (build + vet + test + cgo FFI)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true
          cache-dependency-path: go.sum

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/tunnelcat-proto -> target

      - name: Build the Rust crate (release)
        # The cgo directives in internal/rustbridge/bridge.go
        # point at target/release/libtunnelcat_proto.a. We must
        # build it before `go build` runs, or the link fails.
        working-directory: crates/tunnelcat-proto
        run: cargo build --release

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # `go test -short` skips long-running tests. The full
      # `go test ./...` (without -short) is what CI on a real
      # machine should run; on macOS it can take 25 seconds.
      - name: Test (short)
        run: go test -short -count=1 ./...

      - name: Test (long, only on main)
        if: github.ref == 'refs/heads/main'
        run: go test -count=1 ./...

      - name: Test the cgo FFI bridge
        run: go test -v -count=1 ./internal/rustbridge/...

      - name: gofmt check
        run: |
          if [ "$(gofmt -l . | wc -l)" -gt 0 ]; then
            echo "The following files need gofmt:"
            gofmt -l .
            exit 1
          fi

  # ─────────────────────────────────────────────────────────────
  # Job 2: Cross-build. The friend test runs on whatever
  # platform the friend happens to have. We build for the
  # 3 most common: darwin/amd64, darwin/arm64, linux/amd64.
  # The Rust bridge is cgo-only on the host platform; cross
  # builds use CGO_ENABLED=0 and the bridge returns a runtime
  # error if exercised, but the rest of the data plane still
  # works.
  # ─────────────────────────────────────────────────────────────
  cross-build:
    name: cross-build (${{ matrix.target.os }}/${{ matrix.target.arch }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target:
          - { os: darwin,  arch: amd64 }
          - { os: darwin,  arch: arm64 }
          - { os: linux,   arch: amd64 }
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true
          cache-dependency-path: go.sum

      - name: Build (non-cgo)
        env:
          GOOS:   ${{ matrix.target.os }}
          GOARCH: ${{ matrix.target.arch }}
        run: |
          mkdir -p dist/cross-build
          CGO_ENABLED=0 go build -o dist/cross-build/tunnelcat-${{ matrix.target.os }}-${{ matrix.target.arch }} ./cmd/tunnelcat
          ls -la dist/cross-build/
          file dist/cross-build/* 2>/dev/null || true

  # ─────────────────────────────────────────────────────────────
  # Job 3: Rust tests, fmt, clippy on the protocol crate.
  # ─────────────────────────────────────────────────────────────
  rust:
    name: rust (test + fmt + clippy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/tunnelcat-proto -> target

      - name: Test
        working-directory: crates/tunnelcat-proto
        run: cargo test --verbose

      - name: fmt check
        working-directory: crates/tunnelcat-proto
        run: cargo fmt --all -- --check

      - name: clippy (lints)
        working-directory: crates/tunnelcat-proto
        run: cargo clippy --all-targets -- -D warnings
        continue-on-error: true  # many lints fire on a brand-new crate
