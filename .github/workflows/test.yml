# GitHub Actions workflow for tunnelcat.
#
# Runs on every push and every pull request. Three jobs:
#   1. `go` — `go build`, `go vet`, `go test` on the Go code
#   2. `rust` — `cargo build`, `cargo test` on the protocol crate
#   3. `bridge` — full Go↔Rust cgo integration test
#
# The bridge job is the most important: it proves the FFI boundary
# works. If it fails, Stage 1 cannot proceed.
#
# Cache strategy: Go module cache and Cargo target cache both
# keyed on the lockfile hash. Cuts CI from ~6 min cold to ~2 min warm.
#
# Last updated: 2026-08-30.

name: test

on:
  push:
    branches: [main, "sess-*"]
  pull_request:
    branches: [main]

# Cancel in-flight CI for the same branch on a new push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────
  # Job 1: Go. The bulk of the project.
  # ─────────────────────────────────────────────────────────────
  go:
    name: go (build + vet + test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true
          cache-dependency-path: go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # `go test -short` skips long-running tests. The full
      # `go test ./...` (without -short) is what CI on a real
      # machine should run; on macOS it can take 25 seconds.
      # We use `-short` here because the testharness tests are
      # all t.Skip until Stage 1, and the upstream tailcat tests
      # have no `-short` mode.
      - name: Test (short)
        run: go test -short -count=1 ./...

      - name: Test (long, only on main)
        if: github.ref == 'refs/heads/main'
        run: go test -count=1 ./...

      - name: gofmt check
        run: |
          if [ "$(gofmt -l . | wc -l)" -gt 0 ]; then
            echo "The following files need gofmt:"
            gofmt -l .
            exit 1
          fi

  # ─────────────────────────────────────────────────────────────
  # Job 2: Rust. The protocol crate.
  # ─────────────────────────────────────────────────────────────
  rust:
    name: rust (build + test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/tunnelcat-proto -> target

      - name: Build
        working-directory: crates/tunnelcat-proto
        run: cargo build --verbose

      - name: Test
        working-directory: crates/tunnelcat-proto
        run: cargo test --verbose

      - name: fmt check
        working-directory: crates/tunnelcat-proto
        run: cargo fmt --all -- --check

      - name: clippy (lints)
        working-directory: crates/tunnelcat-proto
        run: cargo clippy --all-targets -- -D warnings
        continue-on-error: true  # many lints fire on a brand-new crate

  # ─────────────────────────────────────────────────────────────
  # Job 3: Go↔Rust bridge. The FFI smoke test.
  # ─────────────────────────────────────────────────────────────
  bridge:
    name: go-rust bridge
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [go, rust]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true
          cache-dependency-path: go.sum

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Build Rust crate
        working-directory: crates/tunnelcat-proto
        run: cargo build --release

      - name: Test the Go bridge
        # The cgo shim links against the static lib. The crate's
        # build.rs copies the C header to a stable include path
        # so #cgo CFLAGS can find it without globbing.
        run: go test -v -count=1 ./internal/rustbridge/...
